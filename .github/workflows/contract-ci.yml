name: Contract CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Test Runner
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest scripts/test_contract.py
          pytest scripts/test_safe_mass_tagger.py

      - name: Run Contract Linter
        run: |
          python scripts/lint_contract.py
